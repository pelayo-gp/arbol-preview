<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>El árbol de las decisiones · Balance Phone</title>
<meta name="description" content="Antes de hablar con tu hijo: un árbol que crece con cada respuesta, y una vista general de todos los caminos.">
<link rel="stylesheet" href="assets/bp-fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap">
<style>
/* ═══ tokens ═══════════════════════════════════════════════════ */
:root{
  --ink:#3A3A3A; --warm:#F5F3EF; --page:#EAE4D5; --card:#FFFFFF;
  --b1:#AEA48C; --b2:#8C877B; --green-02:#6A9E74;
  --display:"Cooper Light",Georgia,serif; --body:"Suisse Intl",system-ui,sans-serif; --mono:"Akkurat Mono","Courier New",monospace;
  --top:64px; --band:60px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%}
body{background:var(--card);color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1px solid var(--green-02);outline-offset:3px}
.mono{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ═══ masthead: wordmark bar and the beige band, as in the mock ═══ */
.top{flex:0 0 var(--top);display:flex;align-items:center;justify-content:center;background:var(--warm)}
.logo{display:block;width:181px;color:var(--ink)}   /* the wordmark alone, 181x21 (designer, 23/09) */ .logo svg{display:block;width:100%;height:auto}
.band{flex:0 0 var(--band);display:flex;align-items:center;justify-content:center;background:var(--page);
  font-family:'Nunito',var(--body);font-weight:600;font-size:17px;letter-spacing:0}   /* Nunito by the designer's spec, 23/09 */

/* ═══ the stage: one static camera ═══════════════════════════════ */
.stage{flex:1;position:relative;overflow:hidden;background:var(--card);min-height:0}

/* landing: the turning tree, the question over it, one button */
.hero{position:absolute;inset:0;display:grid;grid-template-rows:100%;place-items:center;transition:transform 1s var(--ease),opacity .9s ease}   /* words over the tree here, the one place that is allowed (designer, 23/09) */
.hero .turn{height:calc(100% - 40px);width:auto;max-width:100%;display:block;justify-self:center;opacity:.8}   /* dimmed a little, Pelayo 22/09 */
.hero-copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 24px;text-align:center;
  pointer-events:none}   /* the cursor reaches the tree through the words; only the button catches it */
.hero-copy .btn{pointer-events:auto}
.hero-copy .lang{display:flex;gap:22px;margin-top:6px}   /* the language, chosen before anything grows */
.hero-copy .lang button{pointer-events:auto;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--b2);text-decoration:underline;text-underline-offset:3px}
.hero-copy .lang button[aria-selected="true"]{color:var(--ink);text-decoration:none}
.hero-copy .lang button:hover{color:var(--green-02)}
/* the collaborating doctor, bottom left of the start screen (Pelayo, 25/09) */
.credit{position:absolute;left:24px;bottom:24px;display:flex;align-items:flex-end;gap:10px;max-width:520px;pointer-events:none}
.credit img{display:block;width:88px;height:auto;border:1px solid var(--page)}
.credit figcaption{font-family:var(--mono);font-weight:400;font-size:10px;line-height:1.5;letter-spacing:.02em;color:var(--b2);text-decoration:underline;text-underline-offset:3px;padding-bottom:2px}
.hero h1{font-family:var(--display);font-weight:300;font-size:27px;line-height:1.15;letter-spacing:-.01em;max-width:720px;text-wrap:balance}
.stage[data-phase="grow"] .hero{transform:translateY(38%);opacity:0;pointer-events:none}

/* the shop-style controls as the mock draws them: warm fill, no outline */
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:118px;min-height:34px;padding:4px 18px;
  background:var(--warm);color:var(--ink);font-weight:500;font-size:18px;letter-spacing:-.02em;transition:background-color .2s}
.btn.alt{background:var(--warm)}
.btn:hover,.btn:focus-visible{background:var(--page)}
.btn.alt:hover,.btn.alt:focus-visible{background:var(--page)}


/* ═══ version 2: a camera that follows the path, an overview of the whole tree ═══ */
.grow{position:absolute;inset:0;opacity:0;transition:opacity .6s ease .3s;pointer-events:none}
.stage[data-phase="grow"] .grow{opacity:1;pointer-events:auto}
.cam{position:absolute;inset:0;overflow:hidden}
.stage[data-view="map"] .cam{cursor:grab} .stage[data-view="map"] .cam.is-drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.tree{position:absolute;left:0;top:0;color:var(--ink);overflow:visible}
.ghost{opacity:0;transition:opacity .7s ease}
.stage[data-view="map"] .ghost{opacity:var(--dim)}
.panel{position:absolute;width:340px;opacity:0;transition:opacity .35s ease;pointer-events:none}
.panel.is-on{opacity:1;pointer-events:auto}
.stage[data-view="map"] .panel{opacity:0;pointer-events:none}
.panel.is-moving{transition:opacity .35s ease,top .5s var(--ease),left .5s var(--ease)}
.panel h2{font-family:var(--display);font-weight:300;font-size:26px;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.panel .note{margin-top:8px;color:var(--b2);font-size:15px}
.choices{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.links{display:flex;gap:22px;margin-top:14px}
.links button,.views button{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:underline;text-underline-offset:3px}
.links button:hover,.views button:hover{color:var(--green-02)}
.more{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);font-weight:400;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.more::before{content:"";width:9px;height:9px;background:var(--ink);border-radius:50%;flex:0 0 auto}
.more:hover{color:var(--green-02)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.panel.is-open .detail{grid-template-rows:1fr}
.detail .inner{overflow:hidden}
.panel.is-open .inner > *{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.inner .say,.inner .why{margin-top:14px;font-size:15px;line-height:1.5}
.inner .quote{margin-top:14px} .inner .lab{color:var(--green-02)} .inner .res{display:block;margin-top:16px} .inner .res + .grab{margin-top:8px}
.inner .quote p,.inner .voice p{font-family:var(--display);font-weight:300;font-size:19px;line-height:1.22;margin-top:6px}
.inner .voice{margin-top:14px}
.inner .voice figcaption{margin-top:6px;color:var(--b2);font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.grab{display:block;margin-top:16px;text-decoration:none}
.grab .tile{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--page);padding:8px 12px;
  font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:background-color .2s}
.grab:hover .tile{background:var(--warm)}
.grab .tile i{font-style:normal;font-size:20px;line-height:1}
.grab p{margin-top:8px;color:var(--b2);font-size:14px;line-height:1.45}
.inner .recall{margin-top:14px;color:var(--b2);font-size:14px;line-height:1.45}
.panel .panel-scroll{max-height:100%;overflow:auto}
.views{position:absolute;top:18px;right:22px;display:flex;gap:20px;z-index:4}
.views button{color:var(--b2)} .views button[aria-selected="true"]{color:var(--ink)}
.lbl{position:absolute;max-width:172px;font-family:var(--display);font-weight:300;font-size:14px;line-height:1.2;color:var(--ink);text-wrap:balance;
  opacity:0;transition:opacity .45s ease;pointer-events:none;transform:translateY(-50%)}
.lbl[data-side="left"]{text-align:right}
.stage[data-view="map"] .lbl{opacity:.45}
.stage[data-view="map"] .lbl.is-seen{opacity:1}
@media (max-width:900px){
  body{overflow:auto}
  .stage{flex:none;min-height:calc(100dvh - var(--top) - var(--band));overflow:visible}
  .hero{position:relative;height:calc(100dvh - var(--top) - var(--band))}
  .hero h1{font-size:23px}
  .credit{left:16px;bottom:16px;right:16px;max-width:none} .credit img{width:56px} .credit figcaption{font-size:9px}
  .stage[data-phase="grow"] .hero{display:none}
  .grow{position:relative;inset:auto;display:none;flex-direction:column;min-height:calc(100dvh - var(--top) - var(--band))}
  .stage[data-phase="grow"] .grow{display:flex}
  .cam{position:relative;inset:auto;height:54dvh;flex:0 0 auto}
  .panel{position:static;width:auto;padding:16px 20px 40px;opacity:1;pointer-events:auto}
  .stage[data-view="map"] .panel{display:none}
  .panel .panel-scroll{max-height:none}
}
</style>
</head>

  if(SLOW){ step(1); done&&done(); return; }
  const t0=performance.now();
  (function loop(now){ const t=Math.min(1,(now-t0)/dur); step(easeIO(t)); t<1 ? requestAnimationFrame(loop) : done&&done(); })(t0);
}

/* ═══ the camera ═══ one transform on .world; a damped chase in Recorrido, the user's own hand in Vista general */
const C={x:TREE.root[0], y:TREE.root[1], s:.6}, TG={x:C.x, y:C.y, s:C.s};
let view='walk', settled=false, userHeld=false;
const camW=()=>camEl.clientWidth, camH=()=>camEl.clientHeight;
const S_FOLLOW=()=> clamp(Math.min(camH()/1150, (camW()-(MINW+GAP+2*MRG))/W), .3, 1.1);   // about three nodes of height in view, and never wider than the window leaves room for the words
const S_FIT=()=> Math.min((camW()-60)/W, (camH()-60)/H);
const toScreen=(p)=>({x:(p[0]-C.x)*C.s + camW()/2, y:(p[1]-C.y)*C.s + camH()/2});
const TRUNK_X = TREE.nodes.reduce((a,n)=>a+n.pt[0],0)/TREE.nodes.length;   // the tree keeps one place on screen: only the height follows
function aim(point, side){
  const s=S_FOLLOW(), dx = phone()?0:0.10*camW()/s, dy = phone()?0:0.05*camH()/s;
  TG.x=TRUNK_X+dx; TG.y=point[1]+dy; TG.s=s; settled=false; userHeld=false;
}
function applyCam(){ world.style.transform=`translate(${(camW()/2-C.x*C.s).toFixed(2)}px,${(camH()/2-C.y*C.s).toFixed(2)}px) scale(${C.s.toFixed(5)})`; }
function clampMap(){
  const hw=camW()/2/C.s, hh=camH()/2/C.s, m=80;
  C.x = (W+2*m) <= hw*2 ? W/2 : clamp(C.x, -m+hw, W+m-hw);
  C.y = (H+2*m) <= hh*2 ? H/2 : clamp(C.y, -m+hh, H+m-hh);
}
function tick(){
  if(!userHeld && !settled){
    const k=SLOW?1:.11;
    C.x=lerp(C.x,TG.x,k); C.y=lerp(C.y,TG.y,k); C.s=lerp(C.s,TG.s,k);
    if(Math.abs(C.x-TG.x)<.2 && Math.abs(C.y-TG.y)<.2 && Math.abs(C.s-TG.s)<.0005){ C.x=TG.x; C.y=TG.y; C.s=TG.s; settled=true; }
    if(view==='map') clampMap();
    applyCam();
  }
  if(stage.dataset.phase==='grow'){ if(view==='walk' && panel.classList.contains('is-on')) placePanel(); if(view==='map') placeLabels(); }
  requestAnimationFrame(tick);
}

/* ═══ the words beside the current stop ═══ */
let here='q1', path=[], busy=false;
function html(id){
  const n=T[id], isQ=n.k==='q', isEnd=n.k==='exit'||n.k==='end';
  const voices=(n.voice||[]).map(v=>`<figure class="voice"><blockquote><p>${esc(v.t)}</p></blockquote><figcaption>${esc(v.who)}</figcaption></figure>`).join('');
  const grabs=(n.grab||[]).map(g=>`<a class="grab" href="${g.href}" target="_blank" rel="noopener"><span class="tile"><span>${esc(g.title)}</span><i>&darr;</i></span><p>${g.ext?UI.ext:''}${g.es?UI.inEs:''}${esc(g.what)}</p></a>`).join('');
  const hidden=[ n.say?`<p class="say">${esc(n.say)}</p>`:'', n.quote?`<div class="quote"><span class="mono lab">${UI.eg}</span><p>${esc(n.quote)}</p></div>`:'',
    n.why?`<p class="why">${esc(n.why)}</p>`:'', voices, grabs?`<span class="mono lab res">${UI.res}</span>`+grabs:'', isEnd?`<p class="recall">${esc(RECALL)}</p>`:'' ].filter(Boolean).join('');
  const choices = isQ ? `<div class="choices"><button class="btn" data-pick="si">${UI.yes}</button><button class="btn alt" data-pick="no">${UI.no}</button></div>`
                : n.next ? `<div class="choices"><button class="btn" data-pick="si">${UI.cont}</button></div>` : '';
  return `<h2>${esc(tidy(n.q))}</h2>${n.note?`<p class="note">${esc(n.note)}</p>`:''}${choices}`
       + (hidden?`<button class="more" data-open>${n.open}</button><div class="detail"><div class="inner">${hidden}</div></div>`:'')
       + `<div class="links">${path.length?`<button data-back>${UI.back}</button>`:''}${(path.length||here!=='q1')?`<button data-reset>${UI.reset}</button>`:''}</div>`;
}
function panelHeight(open){
  const was=pscroll.style.maxHeight; pscroll.style.maxHeight='none';
  const d=panel.querySelector('.detail'), full=panel.offsetHeight;
  const h = d ? full - d.offsetHeight + (open ? d.firstElementChild.scrollHeight : 0) : full;
  pscroll.style.maxHeight=was; return h;
}
/* where the words go: on their own side when the ink leaves room for them there, on the other side when it does not,
   higher or lower than the stop when a branch runs where they would sit, narrower when nothing wider fits. Every
   candidate width is measured for real (a narrower block is taller and covers more rows), the rows are padded so a
   half pixel never changes the answer, and the words never sit on ink: the alternating side is a preference,
   readability is the rule (Pelayo, 23/09). */
const PW=340, MINW=200, GAP=30, MRG=16, PAD=8, WIDTHS=[PW,300,260,220,MINW], TOPM=48;   // TOPM: under the Recorrido / Vista general control
function solve(roomOn, heightAt, pref, yNode, room, sh, topMin){
  const other = pref==='right'?'left':'right'; let best=null, fall=null;
  for(const width of WIDTHS){
    const h=heightAt(width), fits=h<=sh-topMin-room, span=fits?h:sh-topMin-room;
    const t0 = fits ? clamp(yNode-14, topMin, sh-h-room) : topMin, tops=[t0];              // nearest to the stop first
    if(fits) for(let d=36; d<sh; d+=36){ if(t0-d>=topMin) tops.push(t0-d); if(t0+d<=sh-h-room) tops.push(t0+d); }
    for(const side of [pref,other]) for(const top of tops){
      const r=roomOn(side,top,span).room, far=Math.abs(top-t0), away=side===pref?0:60;
      if(r>=width){ const score=width-.35*far-away; if(!best||score>best.score) best={side, dy:top-yNode, width, score}; }
      else { const score=r-.12*far-away*.7; if(!fall||score>fall.score) fall={side, dy:top-yNode, width:clamp(r,MINW,width), score}; }
    }
  }
  return best||fall;                              // a wide block a little away beats a narrow one at the stop; nothing fitting: the roomiest compromise
}
/* V2 decides once per stop against the camera's target, where the view will settle, and only the position follows the
   live camera: the block never flips sides while the view is still easing. Once settled, one check against the live
   camera; if the words touch ink after all, one re-decision from where the camera really is. */
let fit=null;
const camY=(cam,p)=>(p[1]-cam.y)*cam.s+camH()/2;
function roomOn(cam, side, top, span){                     // free width beside the ink over the rows a block at `top` would cover
  const sh=camH(), sw=camW(), wy0=cam.y+(top-PAD-sh/2)/cam.s, wy1=cam.y+(top+span+PAD-sh/2)/cam.s;
  if(side==='right'){ const x0=(inkRight(wy0,wy1)-cam.x)*cam.s+sw/2+GAP; return {room:sw-MRG-x0, x0}; }
  const x1=(inkLeft(wy0,wy1)-cam.x)*cam.s+sw/2-GAP; return {room:x1-MRG, x1};
}
function decide(cam, pref, isOpen, room){
  const a=anchorOf(here), hs={}, heightAt=w=>{ if(!(w in hs)){ panel.style.width=w+'px'; hs[w]=panelHeight(isOpen); } return hs[w]; };
  fit=solve((sd,top,span)=>roomOn(cam,sd,top,span), heightAt, pref, camY(cam,a), room, camH(), TOPM); panel.style.width=fit.width+'px';
  fit.h=heightAt(fit.width);                     // measured once here, never per frame: measuring toggles max-height, which resets the scroll and thrashes layout
}
function placePanel(open, pref){
  if(phone()){ panel.style.left=panel.style.top=panel.style.width=''; pscroll.style.maxHeight='none'; return; }
  const isOpen = open===undefined ? panel.classList.contains('is-open') : open, sh=camH(), sw=camW(), a=anchorOf(here);
  const room = isOpen ? Math.max(84, Math.round(sh*.14)) : 16;
  if(pref||!fit) decide(TG, pref||sideOf(here), isOpen, room);
  let h=fit.h, fits=h<=sh-TOPM-room, span=fits?h:sh-TOPM-room, top=fits?clamp(camY(C,a)+fit.dy,TOPM,sh-h-room):TOPM, rr=roomOn(C,fit.side,top,span);
  if(settled && !fit.checked){ fit.checked=true; if(rr.room<fit.width-1){ decide(C, fit.side, isOpen, room); fit.checked=true;
    h=fit.h; fits=h<=sh-TOPM-room; span=fits?h:sh-TOPM-room; top=fits?clamp(camY(C,a)+fit.dy,TOPM,sh-h-room):TOPM; rr=roomOn(C,fit.side,top,span); } }
  panel.dataset.side=fit.side;
  panel.style.left=clamp(fit.side==='right' ? rr.x0 : rr.x1-fit.width, MRG, sw-fit.width-MRG)+'px';
  panel.style.top=top+'px';
  const mh = fits ? 'none' : (sh-TOPM-room)+'px'; if(pscroll.style.maxHeight!==mh) pscroll.style.maxHeight=mh;   // only when it changes: a tall block keeps its scroll position
}
function show(id){
  here=id; pscroll.innerHTML=html(id); panel.classList.remove('is-open','is-moving');
  placePanel(false, sideOf(here)); requestAnimationFrame(()=>{ placePanel(false); panel.classList.add('is-on'); }); paintLabels();
}
function hide(){ panel.classList.remove('is-on'); }
function toggle(){
  const b=panel.querySelector('.more'); if(!b) return;
  const open=!panel.classList.contains('is-open');
  panel.classList.add('is-moving'); placePanel(open, fit?fit.side:sideOf(here)); panel.classList.toggle('is-open', open); b.textContent = open ? UI.close : T[here].open;
  setTimeout(()=> panel.classList.remove('is-moving'), 600);
}

/* ═══ the overview labels ═══ */
const LBL={};
[...TRUNK, ...Object.keys(EXIT_OF)].forEach(id=>{ const d=document.createElement('div'); d.className='lbl'; d.dataset.id=id; d.dataset.side=labelSide(id); d.textContent=tidy(T[id].lbl||T[id].q); labelsEl.append(d); LBL[id]=d; });
function seen(id){ return id===here || path.includes(id) || (id in EX && E[id]>=1) || (!(id in EX) && u>=NODE[id]); }
function paintLabels(){ for(const id in LBL) LBL[id].classList.toggle('is-seen', seen(id)); }
function placeLabels(){                       // outside the ink, and pushed apart when two would overlap on one side
  const items=[];
  for(const id in LBL){ const d=LBL[id], side=d.dataset.side, y=toScreen(anchorOf(id)).y, hh=d.offsetHeight||18;
    const wy0=C.y+(y-hh/2-camH()/2)/C.s, wy1=C.y+(y+hh/2-camH()/2)/C.s;                  // the rows the label covers
    const x = side==='right' ? (inkRight(wy0,wy1)-C.x)*C.s+camW()/2+14 : (inkLeft(wy0,wy1)-C.x)*C.s+camW()/2-14-d.offsetWidth;
    items.push({d, side, y, x, h:hh}); }
  for(const side of ['left','right']){
    const arr=items.filter(i=>i.side===side).sort((a,b)=>a.y-b.y);
    for(let pass=0; pass<4; pass++) for(let i=1;i<arr.length;i++){
      const gap=(arr[i-1].h+arr[i].h)/2+8, dd=arr[i].y-arr[i-1].y; if(dd<gap){ const push=(gap-dd)/2; arr[i-1].y-=push; arr[i].y+=push; } }
  }
  for(const i of items){ i.d.style.top=i.y+'px'; i.d.style.left=i.x+'px'; }
}

/* ═══ moves ═══ */
function anchorAt(uu){ const k=Math.min(Math.max(Math.round(uu),0),TRUNK.length); return k===0 ? TREE.root : TREE.nodes[k-1].pt; }
function growTo(n, done){
  const from=u, a=anchorAt(from), b=TREE.nodes[n-1].pt, side=sideOf(TRUNK[n-1]);
  const dur=SLOW?0:Math.min(3000, Math.max(700, 1600*Math.abs(n-from)));
  busy=true; tween(dur, e=>{ render(from+(n-from)*e); aim([lerp(a[0],b[0],e), lerp(a[1],b[1],e)], side); }, ()=>{ busy=false; done&&done(); });
}
function growExit(id, to, done){
  const x=EX[id], from=E[id], dur=SLOW?0:1400;
  busy=true; tween(dur, e=>{ const v=from+(to-from)*e; renderExit(id, v); aim([lerp(x.attach[0],x.tip[0],v), lerp(x.attach[1],x.tip[1],v)], sideOf(id)); }, ()=>{ busy=false; done&&done(); });
}
function go(to){
  if(busy) return; path.push(here); hide();
  setTimeout(()=>{ if(to in EX) growExit(to, 1, ()=> show(to)); else growTo(NODE[to], ()=> show(to)); }, 220);
}
function pick(a){ if(busy||stage.dataset.phase!=='grow'||view!=='walk') return; const n=T[here];
  if(n.k==='q') go(n[a]); else if(n.next && a==='si') go(n.next); }
function back(){
  if(busy||!path.length) return; const from=here, to=path.pop(); hide();
  setTimeout(()=>{ if(from in EX) growExit(from, 0, ()=> show(to)); else growTo(NODE[to], ()=> show(to)); }, 220);
}
function reset(){
  if(busy) return; path=[]; hide();
  const undo=()=>{ const open=Object.keys(E).filter(id=>E[id]>0); if(open.length){ growExit(open[0], 0, undo); return; } growTo(1, ()=> show('q1')); };
  setTimeout(undo, 220);
}
function start(){
  if(stage.dataset.phase==='grow') return; stage.dataset.phase='grow';
  C.s=S_FOLLOW(); C.x=TREE.root[0]; C.y=TREE.root[1]+0.05*camH()/C.s; TG.x=C.x; TG.y=C.y; TG.s=C.s; applyCam(); render(0);
  setTimeout(()=> growTo(1, ()=> show('q1')), 900);
}
function setView(v){
  if(v===view||busy) return; view=v; stage.dataset.view=v;
  document.querySelectorAll('.views button').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.view===v)));
  if(v==='map'){ TG.x=W/2; TG.y=H/2; TG.s=S_FIT(); settled=false; userHeld=false; paintLabels(); placeLabels(); }
  else { fit=null; aim(anchorOf(here), sideOf(here)); }
}

/* ═══ input ═══ */
let drag=null, dragged=false, pinch=null;
document.addEventListener('click', e=>{
  if(dragged){ dragged=false; e.preventDefault(); return; }
  if(e.target.closest('a[href]')) return;
  const b=e.target.closest('button'); if(!b) return;
  if('start' in b.dataset) return start();
  if(b.dataset.lang) return setLang(b.dataset.lang);
  if(b.dataset.pick!==undefined) return pick(b.dataset.pick);
  if('open' in b.dataset) return toggle();
  if('back' in b.dataset) return back();
  if('reset' in b.dataset) return reset();
  if(b.dataset.view) return setView(b.dataset.view);
});
document.addEventListener('keydown', e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.toLowerCase();
  if(stage.dataset.phase!=='grow'){ if(k==='enter'||k===' '){ e.preventDefault(); start(); } return; }
  if(k==='m'){ setView(view==='map'?'walk':'map'); return; }
  if(view!=='walk') return;
  if(k==='s'||k==='y'||k==='arrowright'){ e.preventDefault(); pick('si'); }
  else if(k==='n'||k==='arrowleft'){ e.preventDefault(); pick('no'); }
  else if(k==='backspace'){ e.preventDefault(); back(); }
  else if(k==='arrowdown'||k===' '){ e.preventDefault(); toggle(); }
});
function zoomAt(next, px, py){
  const r=camEl.getBoundingClientRect(), ox=(px-r.left)-camW()/2, oy=(py-r.top)-camH()/2;
  const wx=C.x+ox/C.s, wy=C.y+oy/C.s; C.s=clamp(next, S_FIT()*.85, 1.4);
  C.x=wx-ox/C.s; C.y=wy-oy/C.s; clampMap(); applyCam(); userHeld=true;
}
camEl.addEventListener('wheel', e=>{
  if(view!=='map'||busy) return; e.preventDefault();
  if(e.ctrlKey||e.metaKey) zoomAt(C.s*Math.exp(-e.deltaY*0.01), e.clientX, e.clientY);
  else zoomAt(C.s*Math.exp(-e.deltaY*0.0022), e.clientX, e.clientY);
},{passive:false});
camEl.addEventListener('dblclick', e=>{ if(view!=='map') return; zoomAt(C.s*1.6, e.clientX, e.clientY); });
const pts=new Map();
camEl.addEventListener('pointerdown', e=>{
  if(view!=='map'||busy) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ drag={x:e.clientX,y:e.clientY,cx:C.x,cy:C.y}; dragged=false; camEl.classList.add('is-drag'); }
  else if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s:C.s, mx:(a.x+b.x)/2, my:(a.y+b.y)/2}; drag=null; }
});
camEl.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt(pinch.s*d/pinch.d, pinch.mx, pinch.my); dragged=true; return; }
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>6) dragged=true;
  C.x=drag.cx-dx/C.s; C.y=drag.cy-dy/C.s; clampMap(); applyCam(); userHeld=true;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=> camEl.addEventListener(ev, e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(pts.size===0){ drag=null; camEl.classList.remove('is-drag'); } }));
camEl.style.touchAction='none';
addEventListener('resize', ()=>{ if(stage.dataset.phase!=='grow') return; if(view==='map'){ TG.s=S_FIT(); TG.x=W/2; TG.y=H/2; settled=false; userHeld=false; } else { fit=null; aim(anchorOf(here), sideOf(here)); } });

/* the turning tree: 180 single frames on a canvas at 12 fps, so it can rest on the frame under the cursor and go on from it */
const turnEl=$('#turn'), TCTX=turnEl.getContext('2d'), NF=180, FPS=12, FR=[]; let tPaused=false, tClock=0, tLast=0, tFrame=-1;
for(let i=1;i<=NF;i++){ const im=new Image(); im.src=`assets/turn/f_${String(i).padStart(3,'0')}.gif?v=11`; FR.push(im); }
function turnTick(now){
  if(stage.dataset.phase!=='landing'){ tLast=0; requestAnimationFrame(turnTick); return; }
  if(tLast && !tPaused) tClock += (now-tLast)/1000; tLast=now;
  const f=Math.floor(tClock*FPS)%NF, im=FR[f];
  if(f!==tFrame && im.complete && im.naturalWidth){
    if(turnEl.width!==im.naturalWidth){ turnEl.width=im.naturalWidth; turnEl.height=im.naturalHeight; }
    TCTX.clearRect(0,0,turnEl.width,turnEl.height); TCTX.drawImage(im,0,0); tFrame=f; }
  requestAnimationFrame(turnTick);
}
requestAnimationFrame(turnTick);
turnEl.addEventListener('pointerenter', ()=>{ tPaused=true; });   // holds the current frame
turnEl.addEventListener('pointerleave', ()=>{ tPaused=false; });  // and continues from it

/* ═══ go ═══ */
render(0); applyCam(); requestAnimationFrame(tick);
</script>
</body>
</html>
